# CI de TechNova: se ejecuta en cada push y en cada pull request a main.
#
#   calidad -> ruff (estilo y errores) + pytest (67 tests unitarios)
#   pipeline -> levanta un PostgreSQL de verdad, genera una TechNova pequeña y ejecuta
#               el proyecto ENTERO de punta a punta: generador, ETL (con la API de divisas real),
#               dbt build con sus tests, informes Excel y modelos de Machine Learning.
#               Al final comprueba los resultados y guarda los informes y gráficos como artefactos.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano desde GitHub

concurrency:                  # si se hace otro push, se cancela la ejecución anterior
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad de código y tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (estilo y errores)
        run: ruff check . --output-format=github

      - name: Pytest (tests unitarios)
        run: pytest

  pipeline:
    name: Pipeline de punta a punta
    runs-on: ubuntu-latest
    needs: calidad
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: technova
          POSTGRES_PASSWORD: technova_ci
          POSTGRES_DB: technova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U technova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: technova
      POSTGRES_PASSWORD: technova_ci
      POSTGRES_DB: technova
      TECHNOVA_NUM_CLIENTES: "3000"   # una TechNova pequeña: el CI tarda unos minutos
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar y procesar TechNova desde cero
        run: python scripts/reiniciar_todo.py --si

      - name: Comprobar los resultados
        run: python scripts/comprobar_pipeline.py

      - name: Guardar informes Excel y gráficos de ML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-technova
          path: |
            informes/
            docs/ml/
            logs/
          retention-days: 7
