services:
  postgres:
    image: postgres:17
    container_name: technova_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    # Comprueba cada 5 s que PostgreSQL acepta conexiones.
    # Airflow no arranca hasta que esto dé "healthy".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: technova_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  airflow:
    build: ./airflow
    image: technova-airflow:3.3.2
    container_name: technova_airflow
    restart: unless-stopped
    command: ["bash", "/opt/airflow/arrancar.sh"]
    env_file: .env
    environment:
      # Dentro de Docker, PostgreSQL se llama "postgres" (no "localhost")
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Para que los DAGs encuentren los módulos del ETL y de Machine Learning
      PYTHONPATH: /opt/technova/etl:/opt/technova/ml
      # La imagen oficial comprueba la base de datos de Airflow ANTES de lanzar nuestro script,
      # pero esa base de datos la crea precisamente nuestro script. Desactivamos esa comprobación:
      # ya esperamos a PostgreSQL con el healthcheck y depends_on
      CONNECTION_CHECK_MAX_COUNT: "0"
      # dbt está instalado en su propio entorno de Python dentro de la imagen
      DBT_BIN: /opt/dbt_venv/bin/dbt
      # Configuración de Airflow: AIRFLOW__<SECCION>__<CLAVE>
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Madrid
      # Solo para desarrollo en local: entra en la web sin usuario ni contraseña
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/technova/etl
      - ./data_generator:/opt/technova/data_generator
      - ./sql:/opt/technova/sql
      - ./dbt:/opt/technova/dbt
      - ./data:/opt/technova/data
      - ./logs:/opt/technova/logs
      - ./informes:/opt/technova/informes
      - ./ml:/opt/technova/ml
      - ./models:/opt/technova/models
      - ./docs:/opt/technova/docs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  metabase:
    image: metabase/metabase:v0.64.5.6
    container_name: technova_metabase
    restart: unless-stopped
    environment:
      # Metabase guarda su configuración (usuarios, gráficos, dashboards) en este fichero.
      # Va en un volumen para no perderla al recrear el contenedor
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Madrid
      # Límite de memoria de Java: Metabase no usará más de 1 GB
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - metabase_data:/metabase-data
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -I http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 3m

volumes:
  pgdata:
  pgadmin_data:
  metabase_data: